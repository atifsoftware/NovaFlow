version: '3'

server:
  command: "php worker.php"
  relay: pipes

http:
  address: "0.0.0.0:3000"
  middleware: ["gzip"]
  pool:
    num_workers: 8
    max_jobs: 2000
    allocate_timeout: 60s
    destroy_timeout: 60s

static:
  dir: "public"
  forbid: [".php", ".htaccess"]

logs:
  mode: production
  level: warn
